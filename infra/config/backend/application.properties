# External file; configtree secrets are staged by protected host orchestration.
server.port=8081
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=172\\.29\\.241\\.3
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
spring.datasource.url=jdbc:mysql://mysql:3306/goevent_db?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false&serverTimezone=UTC&characterEncoding=UTF-8&trustCertificateKeyStoreUrl=file:/run/secrets/mysql-truststore.p12&trustCertificateKeyStoreType=PKCS12&fallbackToSystemTrustStore=false
spring.datasource.username=goevent_app
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${MYSQL_TRUSTSTORE_PASSWORD}
spring.flyway.jdbc-properties.trustCertificateKeyStorePassword=${MYSQL_TRUSTSTORE_PASSWORD}
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=goevent_migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.session.redis.configure-action=none
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.username=backend
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=redis
spring.ssl.bundle.pem.redis.truststore.certificate=file:/run/secrets/redis-ca.crt
app.cors.require-https=true
# Required app.cors.allowed-origins and google.client-id come from configtree.
app.cors.allowed-origins=${GOEVENT_ALLOWED_ORIGINS}
google.client-id=${GOEVENT_GOOGLE_CLIENT_ID}
logging.level.root=INFO
logging.level.com.goevent=WARN
logging.file.name=
