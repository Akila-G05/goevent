server.port=8080
# Preserve the real socket peer for the explicitly trusted Caddy resolver.
server.forward-headers-strategy=none
BACKEND_URL=http://backend:8081
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.username=gateway
spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=redis
spring.ssl.bundle.pem.redis.truststore.certificate=file:/run/secrets/redis-ca.crt
spring.data.redis.timeout=1s
app.proxy.trusted-addresses=172.29.240.2
app.cors.require-https=true
app.cors.allowed-origins=${GOEVENT_ALLOWED_ORIGINS}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.gateway.access=none
logging.level.root=INFO
logging.level.com.goevent=WARN
logging.file.name=
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
