# Server
server:
  port: ${PORT:8081}
  servlet:
    context-path: /goevent

spring:
  # Supports launches from either the repository root or backend/.
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  application:
    name: goevent-backend

  # Flyway exclusively owns schema creation and evolution.
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true

  # Credentials come from environment variables or the local root .env.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:goevent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:goevent}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000


# Logging
logging:
  file:
    name: logs/goevent.log

  level:
    root: INFO
    com.goevent: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: logs/goevent.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB


