# Server
server:
  port: ${PORT:8081}
  servlet:
    context-path: /goevent
    session:
      cookie:
        # Scope the session cookie to the whole origin so it is sent with
        # /api/v1/** calls that the Next dev proxy forwards to the gateway.
        path: /

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  session:
    timeout: 30m
    redis:
      namespace: goevent:session

  # Image uploads. The global limit must cover the largest policy (8 MB event
  # banners); each image type is validated again against its own limit.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Supports launches from either the repository root or backend/.
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  application:
    name: goevent-backend

  # Flyway exclusively owns schema creation and evolution.
  sql:
    init:
      mode: never
  flyway:
    enabled: ${STATE:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true

  # Credentials come from environment variables or the local root .env.
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:goevent_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000


# Logging
logging:
  file:
    name: logs/goevent.log

  level:
    root: INFO
    com.goevent: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: logs/goevent.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

google:
  client-id: ${GOOGLE_CLIENT_ID}

# Uploaded images. The default root sits outside the repository and build
# output so cleaning the project never deletes files; point STORAGE_ROOT at a
# mounted volume or cloud directory in production.
app:
  storage:
    root: ${STORAGE_ROOT:${user.home}/goevent/uploads}
    # Base of the public URL stored in MySQL (one folder per owner, e.g.
    # /goevent/api/images/profile/13/<uuid>.png). Replace with a CDN base when
    # images move to cloud storage; the local route then stops being used.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/goevent/api/images}


