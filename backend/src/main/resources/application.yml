# Server
server:
  port: 8080
  servlet:
    context-path: /goevent

spring:
  application:
    name: goevent-backend

  # Configure DB COnnection
  datasource:
    url: jdbc:mysql://localhost:3306/goevent_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: "akila@2005"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000


# Logging
logging:
  file:
    name: logs/goevent.log

  level:
    root: INFO
    com.goevent: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: logs/goevent.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB


