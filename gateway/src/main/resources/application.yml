
# Server
server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"

  application:
    name: goevent-gateway

  # Multipart profile uploads must survive the proxy
  codec:
    max-in-memory-size: 5MB

  # Redis connection
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

  # Gateway routing
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1. Strict rate limit
            - id: test-strict
              uri: http://localhost:8081
              order: -3
              predicates:
                - Path=/goevent/api/test/strict
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 2

            # 2. Normal rate limit
            - id: test-normal
              uri: ${BACKEND_URL}
              order: -2
              predicates:
                - Path=/goevent/api/test/normal
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5

            # 3. Relaxed rate limit
            - id: test-relaxed
              uri: ${BACKEND_URL}
              order: -1
              predicates:
                - Path=/goevent/api/test/relaxed
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

            # Initial content - 6 hours
            - id: goevent-initial-content
              uri: ${BACKEND_URL}
              order: -10
              predicates:
                - Path=/goevent/api/content/initial-data
              filters:
                - name: ResponseCache
                  args:
                    ttlSeconds: 21600
                    namespace: goevent-initial

            # Universities - 1 hour
            - id: goevent-universities
              uri: ${BACKEND_URL}
              order: -9
              predicates:
                - Path=/goevent/api/content/universities
              filters:
                - name: ResponseCache
                  args:
                    ttlSeconds: 3600
                    namespace: goevent-content

            # Organizations - 1 hour
            - id: goevent-organizations
              uri: ${BACKEND_URL}
              order: -8
              predicates:
                - Path=/goevent/api/content/organizations
              filters:
                - name: ResponseCache
                  args:
                    ttlSeconds: 3600
                    namespace: goevent-content

            # 4. Default rate limit for other API routes
            - id: goevent-backend
              uri: ${BACKEND_URL}
              order: 0
              predicates:
                - Path=/goevent/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5

                - name: ResponseCache
                  args:
                    namespace: goevent-test
                    ttlSeconds: 300

# Shared response cache: only these public, non-personalised endpoints
# are allowed to be stored in Redis and reused for other callers.
# Leave the list empty to disable shared response caching entirely.
goevent:
  cache:
    public-paths:
      - /goevent/api/content/universities
      - /goevent/api/content/organizations
      - /goevent/api/content/initial-data

# Logging
logging:
  file:
    name: logs/goevent-gateway.log
  level:
    root: INFO
    com.goevent: DEBUG
    org.springframework.cloud.gateway: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      access: unrestricted
