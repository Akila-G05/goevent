name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_local_password
          MYSQL_DATABASE: goevent_db
          MYSQL_USER: goevent
          MYSQL_PASSWORD: goevent_local_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_local_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Verify Backend
        working-directory: ./backend
        run: |
          mvn clean verify -B
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: goevent_db
          DB_USER: goevent
          DB_PASSWORD: goevent_local_password

  frontend:
    name: Frontend Lint, Typecheck, Test & Build (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: bun run lint

      - name: Typecheck
        working-directory: ./frontend
        run: bun run typecheck

      - name: Run Tests
        working-directory: ./frontend
        run: bun run test

      - name: Build
        working-directory: ./frontend
        run: bun run build
