name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_local_password
          MYSQL_DATABASE: goevent
          MYSQL_USER: goevent
          MYSQL_PASSWORD: goevent_local_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_local_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Verify Backend
        working-directory: ./backend
        run: |
          mvn clean verify -B
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: goevent
          DB_USER: goevent
          DB_PASSWORD: goevent_local_password

  frontend:
    name: Frontend Lint, Typecheck, Test & Build (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: bun run lint

      - name: Typecheck
        working-directory: ./frontend
        run: bun run typecheck

      - name: Run Tests
        working-directory: ./frontend
        run: bun run test

      - name: Build
        working-directory: ./frontend
        run: bun run build
