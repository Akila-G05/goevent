name: Trusted ACR publication
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: acr-main
  cancel-in-progress: false
jobs:
  java:
    name: Java tests (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [backend, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp -Dmaven.compiler.release=21 -f "$MODULE/pom.xml" clean verify
        env:
          MODULE: ${{ matrix.module }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: java-results-${{ matrix.module }}
          path: '**/target/surefire-reports/*.xml'
          retention-days: 3
  frontend:
    name: Bun frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
          bun run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          BACKEND_URL: http://127.0.0.1:8080
  security:
    name: Security policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: |
          pip install -r infra/ci/requirements.lock
          python3 infra/ci/bootstrap.py
          sh infra/ci/security.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-reports
          path: infra/validation/reports/
          retention-days: 3
  images:
    name: Container security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sh infra/ci/images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: image-reports
          path: infra/validation/reports/
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-images
          path: infra/validation/*-image.tar
          retention-days: 3
  runtime:
    name: Isolated application smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mvn -B -ntp -f backend/pom.xml verify org.springframework.boot:spring-boot-maven-plugin:4.0.9:repackage
          mvn -B -ntp -f gateway/pom.xml verify
          mkdir -p infra/validation
          python3 infra/ci/runtime_smoke.py
          python3 infra/ci/dependency_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-smoke-logs
          path: infra/validation/upgrade-runtime-*.log
          retention-days: 3
  publish:
    name: Publish approved digests
    needs: [java, frontend, security, images, runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: goevent-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      MIGRATION_BACKWARD_COMPATIBLE: ${{ vars.MIGRATION_BACKWARD_COMPATIBLE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-images
          path: infra/validation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image-reports
          path: infra/validation/reports
      - run: python3 -c 'import os,sys;sys.path.insert(0,"infra/deploy");from policy import guard_environment;guard_environment(os.environ)'
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: publish
        run: sh infra/ci/publish.sh
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/goevent/backend
          subject-digest: ${{ steps.publish.outputs.backend }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/goevent/gateway
          subject-digest: ${{ steps.publish.outputs.gateway }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployment-candidate
          path: infra/validation/release/
          retention-days: 7
